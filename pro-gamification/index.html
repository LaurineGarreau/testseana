<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seanapps Pro · Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout : reprise de Seanapps Pro (menu latéral fixe + zone de travail grise avec des blocs blancs). Les nouveautés portent une pastille « Nouveau ». */
:root{
  --bg:#f3f4f7; --panel:#ffffff; --line:#e5e7ee; --line-2:#eef0f5;
  --ink:#1f2430; --ink-2:#4b5263; --ink-3:#7b8294;
  --blue:#2a64e8; --blue-ink:#1f4fc4; --blue-soft:#eaf0fe; --blue-softer:#f4f7ff;
  --yellow-bg:#fdf1cf; --yellow-ink:#8a5d00;
  --green-bg:#e3f5ea; --green-ink:#17824a; --green:#22a35d;
  --orange-bg:#fdebdc; --orange-ink:#b4530b; --orange:#e9822f;
  --red:#d6283a; --red-bg:#fde6e8;
  --new-bg:#efe9fe; --new-ink:#6a3fd8;
  --bar-1:#93bdf5; --bar-2:#3f86e6; --bar-3:#c6dcfb; --bar-dark:#4a4f5c;
  --shadow:0 1px 2px rgba(20,30,60,.05),0 2px 8px rgba(20,30,60,.04);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --panel:#1b1f29; --line:#2b3140; --line-2:#242a37;
  --ink:#e8ebf2; --ink-2:#b6bccb; --ink-3:#8a91a3;
  --blue:#5b8cf5; --blue-ink:#8eb0fa; --blue-soft:#22304f; --blue-softer:#1c2538;
  --yellow-bg:#3d3216; --yellow-ink:#f2c95c;
  --green-bg:#173626; --green-ink:#63d494; --green:#3fbf76;
  --orange-bg:#3d2615; --orange-ink:#f5a25e; --orange:#f08a38;
  --red:#f0596a; --red-bg:#3f1d22;
  --new-bg:#2c2346; --new-ink:#b59bff;
  --bar-1:#3d6db8; --bar-2:#6ea2f0; --bar-3:#2a3e62; --bar-dark:#9aa1b3;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12151c; --panel:#1b1f29; --line:#2b3140; --line-2:#242a37;
  --ink:#e8ebf2; --ink-2:#b6bccb; --ink-3:#8a91a3;
  --blue:#5b8cf5; --blue-ink:#8eb0fa; --blue-soft:#22304f; --blue-softer:#1c2538;
  --yellow-bg:#3d3216; --yellow-ink:#f2c95c;
  --green-bg:#173626; --green-ink:#63d494; --green:#3fbf76;
  --orange-bg:#3d2615; --orange-ink:#f5a25e; --orange:#f08a38;
  --red:#f0596a; --red-bg:#3f1d22;
  --new-bg:#2c2346; --new-ink:#b59bff;
  --bar-1:#3d6db8; --bar-2:#6ea2f0; --bar-3:#2a3e62; --bar-dark:#9aa1b3;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
a{color:var(--blue)}
svg{flex:none}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
/* ---------- Sidebar ---------- */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 12px;overflow-y:auto}
.logo{display:flex;align-items:baseline;gap:1px;padding:0 10px 14px;font-size:24px;letter-spacing:-.02em}
.logo .p{color:var(--blue);font-weight:400}
.logo .s{color:var(--ink);font-weight:700}
.nav-sec{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:14px 10px 6px}
.nav a{white-space:nowrap;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:15px}
.nav a:hover{background:var(--line-2)}
.nav a.on{background:var(--blue-soft);color:var(--blue-ink);font-weight:500}
.nav a .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:600;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.nav a .nw{margin-left:auto}
.side .fab{margin-top:auto}
.side .me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;background:var(--line-2);font-weight:500}
/* ---------- Main ---------- */
.main{overflow-y:auto;min-width:0}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:20px 28px 8px}
.h1{font-size:30px;font-weight:600;color:var(--blue-ink);background:var(--blue-softer);padding:6px 12px;border-radius:8px;letter-spacing:-.01em}
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:9px 16px;font-weight:500;font-size:14px;border:1px solid transparent;white-space:nowrap}
.btn-out{border-color:var(--blue);color:var(--blue)}
.btn-out:hover{background:var(--blue-softer)}
.btn-pri{background:var(--blue);color:#fff}
.btn-pri:hover{filter:brightness(1.07)}
.btn-ghost{color:var(--ink-2);border-color:var(--line)}
.btn-ghost:hover{background:var(--line-2)}
.btn-sm{padding:6px 11px;font-size:13px}
.wrap{padding:8px 28px 40px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.zone{background:var(--panel);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.zone-gray{background:transparent;padding:0;box-shadow:none}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-day{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:17px;font-weight:600}
.card-h .sub{color:var(--ink-3);font-size:14px}
.card-b{padding:16px 18px}
.total{margin-left:auto;text-align:left;border-left:1px solid var(--line);padding-left:18px}
.total small{display:block;color:var(--ink-3);font-size:13px}
.total b{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap}
.c-yellow{background:var(--yellow-bg);color:var(--yellow-ink)}
.c-green{background:var(--green-bg);color:var(--green-ink)}
.c-orange{background:var(--orange-bg);color:var(--orange-ink)}
.c-red{background:var(--red-bg);color:var(--red)}
.c-grey{background:var(--line-2);color:var(--ink-2)}
.c-new{background:var(--new-bg);color:var(--new-ink);font-size:11px;font-weight:600;letter-spacing:.02em;padding:2px 8px}
.dot{width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.muted{color:var(--ink-3)}
.sec-title{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:600;margin:2px 4px 14px}
/* ---------- Ma journée ---------- */
.day-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prog{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);border-radius:3px;transition:width .35s ease}
.task{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line-2)}
.task:first-child{border-top:0}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;flex:none;transition:.2s}
.tick:hover{border-color:var(--blue)}
.task.done .tick{background:var(--green);border-color:var(--green);color:#fff}
.task .tt{min-width:0;flex:1}
.task .tt b{font-weight:500;display:block}
.task.done .tt b{text-decoration:line-through;color:var(--ink-3)}
.task .tt span{font-size:13px;color:var(--ink-3)}
.task .nudge{color:var(--orange-ink)}
.alldone{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:26px 10px 18px}
.alldone .big{width:56px;height:56px;border-radius:50%;background:var(--green-bg);color:var(--green-ink);display:grid;place-items:center;animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.alldone h4{margin:6px 0 0;font-size:20px}
.done-list{font-size:13px;color:var(--ink-3);border-top:1px solid var(--line-2);padding-top:10px;margin-top:6px}
.linkbtn{color:var(--blue);font-weight:500;font-size:13px}
.linkbtn:hover{text-decoration:underline}
/* ---------- État du parc ---------- */
.health{display:flex;align-items:center;gap:12px;padding:14px;border-radius:10px}
.health.ok{background:var(--green-bg);color:var(--green-ink)}
.health.warn{background:var(--orange-bg);color:var(--orange-ink)}
.health .ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--panel)}
.health b{font-size:16px;display:block}
.metric{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:9px 0}
.metric .mbar{grid-column:1/-1;position:relative;height:6px;border-radius:3px;background:var(--line-2)}
.metric .mbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.metric .mbar u{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink-2);border-radius:1px}
.metric .v{font-variant-numeric:tabular-nums;font-weight:600}
.act{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line-2);font-size:13.5px}
.act:first-child{border-top:0}
.act .b{width:8px;height:8px;border-radius:50%;background:var(--orange);flex:none}
/* ---------- charts ---------- */
.bars{display:flex;align-items:flex-end;gap:14px;height:190px;padding:10px 6px 0;border-bottom:1px solid var(--line)}
.bars div{flex:1;border-radius:6px 6px 0 0}
.blabels{display:flex;gap:14px;padding:6px 6px 0;font-size:13px;color:var(--ink-2)}
.blabels span{flex:1;text-align:center}
.mbars{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px}
.mbars div{flex:1;border-radius:4px 4px 0 0;background:var(--bar-1)}
.mlabels{display:flex;gap:6px;font-size:11.5px;color:var(--ink-2);padding-top:6px}
.mlabels span{flex:1;text-align:center}
.legend{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--ink-2);padding-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.insp{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.insp+.insp{margin-top:10px}
.insp .t{font-weight:500}
.insp .d{color:var(--ink-2);font-size:13.5px}
/* ---------- bannière bilan ---------- */
.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--blue-softer);border:1px solid var(--blue-soft);border-radius:12px;padding:12px 16px}
.banner .ico{width:36px;height:36px;border-radius:9px;background:var(--panel);display:grid;place-items:center;color:var(--blue)}
/* ---------- Bateaux ---------- */
.split{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:12px;padding:12px 16px 16px;height:100%;min-height:0}
.listcol{background:var(--panel);border-radius:12px;display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow)}
.listcol .lh{padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px}
.search{display:flex;gap:8px}
.search .in{flex:1;display:flex;align-items:center;gap:8px;background:var(--line-2);border-radius:8px;padding:0 12px;color:var(--ink-3);min-width:0}
.search input{border:0;background:transparent;outline:0;font:inherit;color:var(--ink);padding:10px 0;width:100%}
.sq{width:42px;height:42px;border-radius:8px;display:grid;place-items:center}
.sq-blue{background:var(--blue);color:#fff}
.boats{overflow-y:auto;padding:4px 10px 10px;display:flex;flex-direction:column;gap:8px}
.boat{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;text-align:left;width:100%}
.boat:hover{border-color:var(--blue)}
.boat.on{background:var(--blue);border-color:var(--blue);color:#fff}
.boat.on .muted{color:#dbe6ff}
.boat .av{width:34px;height:34px;border-radius:50%;background:var(--line-2);display:grid;place-items:center;font-weight:600;color:var(--ink-2);flex:none}
.boat.on .av{background:rgba(255,255,255,.18);color:#fff}
.boat .nm{flex:1;min-width:0}
.boat .nm b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.boat .chip{margin-left:auto}
.boat.on .chip.c-yellow{background:#fff3d6;color:#7a5200}
.boat .mini{font-size:11.5px;font-weight:600;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:2px 8px}
.boat.on .mini{background:#fff;color:var(--blue)}
.fiche{display:flex;flex-direction:column;gap:12px;min-width:0;overflow-y:auto}
.fh{background:var(--panel);border-radius:12px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;box-shadow:var(--shadow)}
.fh h2{margin:0;font-size:20px;font-weight:600}
.fh .meta{flex-basis:100%;color:var(--ink-2);font-size:14px;display:flex;gap:24px;flex-wrap:wrap}
.blk{background:var(--panel);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.blk h4{margin:0;font-size:16px;font-weight:600}
.blk .row{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.85fr);gap:12px}
.fcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.field{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px;color:var(--ink-2)}
.toggle{width:44px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none;transition:.2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.2s}
.toggle[aria-checked="true"]{background:var(--blue)}
.toggle[aria-checked="true"]::after{left:23px}
.foot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.owner{background:var(--panel);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.owner .ib{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--blue);color:#fff}
.owner .ib.x{background:transparent;border:1px solid var(--red);color:var(--red)}
.big-btn{background:var(--blue);color:#fff;border-radius:10px;font-size:16px;font-weight:500;padding:16px;width:100%}
.big-btn[disabled]{opacity:.45;cursor:not-allowed}
/* checklist mise en service */
.ck-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.step{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line-2)}
.step .n{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink-3);flex:none}
.step.ok .n{background:var(--green);border-color:var(--green);color:#fff}
.step.cur .n{border-color:var(--blue);color:var(--blue)}
.step .sb{flex:1;min-width:0}
.step .sb b{font-weight:500}
.step.ok .sb b{color:var(--ink-3)}
.step .sd{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.warn-note{display:flex;gap:8px;align-items:flex-start;background:var(--yellow-bg);color:var(--yellow-ink);font-size:13px;border-radius:8px;padding:8px 10px;margin-top:8px}
/* ---------- Messages ---------- */
.msgs{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:12px;padding:12px 16px 16px;height:100%;min-height:0}
.conv{display:flex;gap:10px;padding:12px;border-radius:10px;border:1px solid var(--line);text-align:left;width:100%}
.conv.on{border-color:var(--blue);background:var(--blue-softer)}
.conv .nm{flex:1;min-width:0}
.conv .nm b{font-weight:500}
.conv .nm span{display:block;font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread{background:var(--panel);border-radius:12px;display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow)}
.thread .th{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bubbles{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:72%;padding:10px 14px;border-radius:14px;background:var(--line-2)}
.bub.me{align-self:flex-end;background:var(--blue);color:#fff}
.bub small{display:block;font-size:11.5px;opacity:.7;margin-top:4px}
.composer{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;color:var(--ink);background:var(--panel);min-height:44px}
.rt{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow)}
.rt .big{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
/* ---------- Concession ---------- */
.status-hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.medal{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);flex:none;position:relative}
.medal.get{background:var(--green-bg);color:var(--green-ink)}
.crit{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:14px 0;border-top:1px solid var(--line-2)}
.crit .ci{width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.crit .ci.ok{background:var(--green-bg);color:var(--green-ink)}
.crit .ci.no{background:var(--orange-bg);color:var(--orange-ink)}
.crit .mbar{grid-column:2/-1;position:relative;height:7px;border-radius:4px;background:var(--line-2)}
.crit .mbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.crit .mbar u{position:absolute;top:-4px;width:2px;height:15px;background:var(--ink-2)}
.perk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line-2)}
.perk:first-child{border-top:0}
.perk .pi{width:30px;height:30px;border-radius:8px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
/* ---------- Bilan ---------- */
.mail{max-width:680px;margin:0 auto;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.mail .mh{padding:14px 20px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink-2);display:grid;gap:2px}
.mail .mb{padding:26px 28px;display:flex;flex-direction:column;gap:18px}
.mail h2{margin:0;font-size:24px;letter-spacing:-.01em}
.mrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mstat{border:1px solid var(--line);border-radius:10px;padding:12px}
.mstat b{font-size:24px;display:block;font-variant-numeric:tabular-nums}
.mstat span{font-size:13px;color:var(--ink-2)}
.mlist a{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line-2);text-decoration:none;color:var(--ink)}
.mlist a span:last-child{color:var(--blue);white-space:nowrap}
/* ---------- placeholder ---------- */
.empty{background:var(--panel);border-radius:14px;padding:40px 24px;text-align:center;color:var(--ink-2);box-shadow:var(--shadow)}
/* ---------- Nouveautés ---------- */
.fab{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--new-ink);color:#fff;border-radius:8px;padding:10px 14px;font-weight:600;margin:12px 0 10px}
.fab-m{margin:0 0 0 auto;padding:8px 12px;font-size:13px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--panel);z-index:40;box-shadow:-8px 0 30px rgba(0,0,0,.15);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer .dl{overflow-y:auto;padding:8px 20px 20px}
.piste{padding:14px 0;border-top:1px solid var(--line-2)}
.piste:first-child{border-top:0}
.piste h5{margin:0 0 4px;font-size:15px;display:flex;gap:8px;align-items:center}
.piste h5 em{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--new-bg);color:var(--new-ink);display:grid;place-items:center;font-size:12px;flex:none}
.piste p{margin:0 0 6px;color:var(--ink-2);font-size:13.5px}
.piste small{color:var(--ink-3);font-size:12.5px}
.scrim{position:fixed;inset:0;background:rgba(10,14,30,.35);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--panel);padding:11px 16px;border-radius:10px;font-weight:500;z-index:50;opacity:0;transition:.25s;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.mobbar{display:none}
.proto-note{font-size:12px;color:var(--ink-3);text-align:center;padding:4px 0 0}
/* ---------- responsive ---------- */
@media (max-width:1180px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g3>:last-child{grid-column:1/-1}}
@media (max-width:980px){.g-day,.fgrid,.g2{grid-template-columns:minmax(0,1fr)}.split,.msgs{grid-template-columns:minmax(0,1fr);height:auto}.boats{max-height:330px}.thread{min-height:460px}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:45;transform:translateX(-100%);transition:transform .25s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .mobbar{display:flex;align-items:center;gap:12px;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mobbar .logo{padding:0;font-size:20px}
  .top{padding:16px 16px 4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .split,.msgs{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .h1{font-size:24px}
  .g3{grid-template-columns:minmax(0,1fr)}
  .mrow{grid-template-columns:minmax(0,1fr)}
  .foot{grid-template-columns:minmax(0,1fr)}
  .mail .mb{padding:20px 18px}
  .bub{max-width:88%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* ======================= Icônes ======================= */
const I = {

const ic=(n,s=20,w=1.8)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

    {id:'t2',kind:'stock',title:'Déclarer 2 bateaux en stock',ctx:'Déclaration de novembre',go:'#stock',done:false},

    {id:'c3',name:'Ronan Leroy',boat:'Mate (Simulation 22)',last:'Vous : Le devis est dans vos documents.',ago:'lun.',msgs:[

const sel=()=>S.boats.find(b=>b.id===S.sel);

/* ======================= Calculs ======================= */
function health(){
  const late=S.tasks.find(t=>t.id==='t1'&&!t.done);
  const stock=S.tasks.find(t=>t.id==='t2'&&!t.done);
  const box=!S.boats.find(b=>b.id==='b1').steps[3];
  const acts=[];
  if(late) acts.push({t:'1 inspection en retard',d:'Contrôle à 1 an · Test Boat',go:'#bateaux',boat:'b3'});
  if(stock) acts.push({t:'2 bateaux non déclarés',d:'Déclaration de novembre',go:'#stock'});
  if(box) acts.push({t:'1 boîtier à activer',d:'Princess 3 · mise en service',go:'#bateaux',boat:'b1'});
  const m={
    insp: late?92:97,
    stock: stock?96:100,
    box: box?80:90
  };
  return {ok:acts.length===0,acts,m};
}
function statusCrit(){
  const h=health().m;
  return [
    {k:'Inspections faites à temps',v:h.insp,seuil:95,why:'Inspections réalisées avant leur date limite, sur le trimestre.'},

}

/* ======================= Tableau de bord ======================= */

  const h=health();

      <section class="card" aria-label="État du parc">
        <div class="card-h"><h3>État du parc</h3>${NEW}<span class="muted" style="margin-left:auto;font-size:13px">90 derniers jours</span></div>
        <div class="card-b" style="display:flex;flex-direction:column;gap:12px">
          <div class="health ${h.ok?'ok':'warn'}">
            <div class="ico">${ic(h.ok?'check':'pulse',20,2.2)}</div>
            <div><b>${h.ok?'Parc en bonne santé':'À surveiller'}</b><span style="font-size:13px">${h.ok?'Aucune alerte en retard, stock à jour.':`${h.acts.length} point${h.acts.length>1?'s':''} pour revenir au vert`}</span></div>

            <div class="metric"><span>${k}</span><span class="v">${v} %</span>
              <div class="mbar"><i style="width:${v}%;background:${v>=s?'var(--green)':'var(--orange)'}"></i><u style="left:${s}%" title="Objectif ${s} %"></u></div></div>`).join('')}

          <div class="card-b">
            <div class="bars"><div style="height:6%;background:var(--bar-3)"></div><div style="height:26%;background:var(--bar-3)"></div><div style="height:100%;background:var(--bar-dark)"></div></div>
            <div class="blabels"><span>Livraison</span><span>Transféré</span><span>Reprises</span></div>
            <div style="padding-top:16px;color:var(--ink-2)">5 bateaux vendus en 2026</div>
          </div>
        </section>
        <section class="card">

  const r=route();
  const views={dashboard:vDashboard,bateaux:vBateaux,messages:vMessages,concession:vConcession,bilan:vBilan,stock:vStock,
    clients:()=>vEmpty('Clients'),fleet:()=>vEmpty('Fleet'),notifications:()=>vEmpty('Notifications'),historique:()=>vEmpty('Historique'),partage:()=>vEmpty('Stock partagé'),services:()=>vEmpty('Services'),parametres:()=>vEmpty('Paramètres')};
  const main=document.getElementById('main');
  main.innerHTML=(views[r]||vDashboard)();
  renderNav();
  document.getElementById('side').classList.remove('open');
}
function doneTask(id,msg){const t=S.tasks.find(x=>x.id===id);if(t&&!t.done){t.done=true;if(id==='t4'){S.boats.find(b=>b.id==='b1').steps[3]=true;}if(id==='t3'){S.convs[0].unread=false;}if(msg)toast(msg);}}
function checkAllDone(){if(S.tasks.every(t=>t.done))toast('Tout est traité pour aujourd’hui');}

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-go-boat]');
  if(a&&a.dataset.goBoat){S.sel=a.dataset.goBoat;}
  if(e.target.closest('[data-close]'))openNews(false);
  const tick=e.target.closest('[data-tick]');
  if(tick){doneTask(tick.dataset.tick);render();checkAllDone();return;}
  if(e.target.closest('#resetDay')){S.tasks.forEach(t=>t.done=t.id==='t5');const b1=S.boats.find(b=>b.id==='b1');b1.steps=[true,true,true,false,false];b1.status='Mise en service';S.convs[0].unread=true;render();return;}
  const bt=e.target.closest('[data-boat]');
  if(bt){S.sel=bt.dataset.boat;render();return;}
  const st=e.target.closest('[data-step]');
  if(st){const b=sel();if(b.steps){const i=+st.dataset.step;if(i===3&&!b.steps[3]&&b.steps[2]){b.steps[3]=true;if(b.id==='b1')doneTask('t4');toast('Boîtier activé · il remonte bien ses données');render();}else if(i===3&&!b.steps[2]){toast('Rattachez d’abord le propriétaire');}}return;}
  if(e.target.closest('#mes')){const b=sel();b.steps[4]=true;b.status='Livré';toast(`Mise en service terminée · ${b.owner} a reçu son accès`);render();checkAllDone();return;}
  const ins=e.target.closest('[data-insp]');
  if(ins){doneTask('t1','Inspection enregistrée');const b=S.boats.find(x=>x.id==='b3');render();checkAllDone();return;}
  if(e.target.closest('#declare')){doneTask('t2','Stock de novembre déclaré');render();checkAllDone();return;}
  const cv=e.target.closest('[data-conv]');
  if(cv){S.conv=cv.dataset.conv;render();return;}
  if(e.target.closest('#ownTog')){S.showOwners=!S.showOwners;render();toast(S.showOwners?'Délai affiché aux propriétaires':'Délai visible seulement par vous et Bénéteau');return;}
  if(e.target.closest('[data-open-news]')){openNews(true);return;}
  if(e.target.closest('#closeNews')||e.target.id==='scrim'){openNews(false);return;}
  if(e.target.closest('#menuBtn')){document.getElementById('side').classList.toggle('open');return;}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')openNews(false);
  if((e.key===' '||e.key==='Enter')&&e.target.id==='ownTog'){e.preventDefault();e.target.click();}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='compose')return;
  e.preventDefault();
  const ta=document.getElementById('reply');const v=ta.value.trim();if(!v)return;
  const c=S.convs.find(x=>x.id===S.conv);
  c.msgs.push({me:true,t:v,h:'À l’instant'});c.last='Vous : '+v;c.ago='à l’instant';
  if(c.unread){c.unread=false;if(c.id==='c1')doneTask('t3');}
  render();toast('Message envoyé');checkAllDone();
  const bb=document.getElementById('bubbles');if(bb)bb.scrollTop=bb.scrollHeight;
});
document.addEventListener('input',e=>{
  if(e.target.id!=='q')return;
  const q=e.target.value.toLowerCase();
  document.querySelectorAll('.boat[data-boat]').forEach(el=>{el.hidden=!el.textContent.toLowerCase().includes(q)});
});
window.addEventListener('hashchange',()=>{render();document.getElementById('main').scrollTop=0;});
renderDrawer();render();
</script>

</body>
</html>
